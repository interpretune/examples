# The catalog: the pinned, tested list of components the gallery links to. Open discovery stays the Hub's
# `interpretune` tag; an entry here is a promise that the component works with the interpretune range it names.
#
# Each entry:
#   repo:          the Hub repository (owner/name)
#   revision:      a full commit sha, never a branch
#   kinds:         the component kinds it provides
#   interpretune:  the tested interpretune version range
#   owner:         who fixes it when it breaks
#   smoke:         what the scheduled run executes on CPU, from empty caches at `revision`: a module configuration
#                  key (pulled, loaded and run for one batch), or, for a component with no CPU session configuration,
#                  a directory of its published snapshot ending in `/` holding its own CPU tests (`tests/`)
#   first_party:   true when its source lives under components/
components:
  - repo: speediedan/rte
    revision: 4e58126454837a6572b13c9d53c1af15e0605478
    kinds: [module, datamodule]
    interpretune: '>=0.1.dev0'
    owner: speediedan
    smoke: rte_demo.gpt2.core
    first_party: true
  - repo: speediedan/prompt-configs
    revision: 3d8b9710061283dd14c86a46f0c0649b5e262db0
    kinds: [promptconfigs]
    interpretune: '>=0.1.dev0'
    owner: speediedan
    smoke: null  # definitions only: composed by other components' configurations (compose_ref), not run alone
    first_party: true
  - repo: speediedan/jlens_steering_ops
    revision: 22b03610f1a2eb4a8afc4957f17cf6a77e46ff87
    kinds: [ops]
    interpretune: '>=0.1.dev0'
    owner: speediedan
    smoke: tests/  # an op collection has no session configuration: its own CPU tests, run from the snapshot
    first_party: true
  - repo: speediedan/concept-direction
    revision: 618a73abae788f91c4f2a8548d230cbec5d645cb
    kinds: [experiment, helpers]
    interpretune: '>=0.1.dev0'
    owner: speediedan
    smoke: tests/  # its experiments load Gemma 3 1B: its CPU stage-table tests, run from the snapshot
    first_party: true
  - repo: speediedan/prompt-analysis
    revision: 734afa3614851ca3027512089dfc519a30370d5e
    kinds: [module, helpers]
    interpretune: '>=0.1.dev0'
    owner: speediedan
    smoke: tests/  # its configurations load gated or GPU-sized models: its helpers' CPU tests, run from the snapshot
    first_party: true
  - repo: speediedan/neuron-communities
    revision: 9176d38f345fcb6805e257ed9fdee377cafc0fd1
    kinds: [helpers]
