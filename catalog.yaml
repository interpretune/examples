# The catalog: the pinned, tested list of components the gallery links to. Open discovery stays the Hub's
# `interpretune` tag; an entry here is a promise that the component works with the interpretune range it names.
#
# Each entry:
#   repo:          the Hub repository (owner/name)
#   revision:      a full commit sha, never a branch
#   kinds:         the component kinds it provides
#   interpretune:  the tested interpretune version range
#   owner:         who fixes it when it breaks
#   smoke:         a CPU configuration the scheduled run executes
#   first_party:   true when its source lives under components/
components:
  - repo: speediedan/rte
    revision: b1a920fc1400837a62bc7a2b155e39e5da206b86
    kinds: [module, datamodule]
    interpretune: '>=0.1.dev0'
    owner: speediedan
    smoke: rte_demo.gpt2.core
    first_party: true
  - repo: speediedan/prompt-configs
    revision: 3d8b9710061283dd14c86a46f0c0649b5e262db0
    kinds: [promptconfigs]
    interpretune: '>=0.1.dev0'
    owner: speediedan
    smoke: null  # definitions only: composed by other components' configurations (compose_ref), not run alone
    first_party: true
  - repo: speediedan/concept-direction
    revision: 1b173742869f717caf218f2e6afb4deb8f94d0e5
    kinds: [experiment]
    interpretune: '>=0.1.dev0'
    owner: speediedan
    smoke: null  # no CPU smoke configuration chosen yet
    first_party: true
  - repo: speediedan/concept_direction_ops
    revision: 16affe3811eb8c5e601def07bd47b41ef4fcdf47
    kinds: [ops]
    interpretune: '>=0.1.0.dev0'
    owner: speediedan
    smoke: null  # an op collection: exercised by the tutorials that load it, not run alone
    first_party: true
  - repo: speediedan/jlens_steering_ops
    revision: ebf92e02d14313bc676acde37a17ed1960c1c594
    kinds: [ops]
    interpretune: '>=0.1.dev0'
    owner: speediedan
    smoke: null  # an op collection: its own tests/ run its CPU checks
    first_party: true
  - repo: speediedan/jspace-battery
    revision: 8cac45ebf7e72f2a7b277f30371261cd336a522d
    kinds: [experiment]
    interpretune: '>=0.1.dev0'
    owner: speediedan
    smoke: null  # no CPU smoke configuration chosen yet
    first_party: true
  - repo: speediedan/prompt-analysis
    revision: d221f0e9293888836a0101509546968eced813bd
