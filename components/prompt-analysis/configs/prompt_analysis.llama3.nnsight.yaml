# Derived key: prompt_analysis.llama3.nnsight
# Model and adapter composition only: Llama-3.1-8B through nnsight, with no latent model. No prompts: a caller passes
# token batches to the module's model backend, or supplies prompts (`datamodule_cfg.prompt_cfg.prompts`).
task_variant: prompt_analysis
model: llama3
composition: [nnsight]
extensions: []
descriptor: null
reg_info:
  model_src_key: llama3
  model_cfg_key: prompt_analysis
  adapter_combinations:
    - [core, nnsight]
  description: The model alone on free-form prompts through NNsight, Llama-3.1-8B in bf16 (non-instruction tuned)
shared_config:
  task_name: prompt_analysis
  os_env_model_auth_key: HF_GATED_PUBLIC_REPO_AUTH_KEY
  model_name_or_path: meta-llama/Llama-3.1-8B
  tokenizer_id_overrides:
    pad_token_id: 128004  # <|finetune_right_pad_id|>: the base tokenizer names no pad token
  tokenizer_kwargs:
      model_input_names: ['input_ids', 'attention_mask']
      padding_side: left
      add_bos_token: true
registered_cfg:
  datamodule_cfg:
    prompt_cfg:
      class_path: prompt_analysis.PromptSetConfig
    signature_columns: ['input_ids', 'attention_mask']
    enable_datasets_cache: False
    eval_batch_size: 1
  module_cfg:
    class_path: interpretune.adapters.nnsight.config.ITNNsightConfig
    init_args:
      nnsight_cfg:
        class_path: interpretune.adapters.nnsight.config.NNsightConfig
        init_args:
          model_name: meta-llama/Llama-3.1-8B
          device_map: cuda
          torch_dtype: bfloat16
          dispatch: true
          tokenizer_kwargs:
            padding_side: left
  datamodule_cls:
    class_path: prompt_analysis.PromptDataModule
  # [core, nnsight] registers NNsightModule itself, so the module class here is the task module that adds no adapter
  module_cls:
    class_path: interpretune.harness.sessions.ReadoutModule
