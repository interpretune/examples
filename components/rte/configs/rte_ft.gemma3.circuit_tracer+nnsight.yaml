# Derived key: rte_ft.gemma3.circuit_tracer+nnsight
# gemma-3-270m-it with every layer's Gemma Scope 2 transcoder (16k features), circuit-tracer over nnsight, small enough to
# tune and attribute on a CPU. `tune_base` puts the base model's parameters in the tunable view beside the transcoders, and
# the transcoders load eagerly, so a schedule can promote and tune them whole (set `lazy_decoder` and `lazy_delta_rank`
# to tune low-rank corrections of lazily loaded decoders instead). fp32: run the core loop with `precision: "32"`.
task_variant: rte_ft
model: gemma3
composition: [circuit_tracer, nnsight]
extensions: []
descriptor: null
reg_info:
  model_src_key: gemma3
  model_cfg_key: rte_ft
  adapter_combinations:
    - [core, nnsight, circuit_tracer]
  description: Circuit Tracer over NNsight with Gemma3-270m-it and Gemma Scope 2 transcoders, tuned in stages (CPU-sized)
shared_config:
  task_name: rte
  os_env_model_auth_key: HF_GATED_PUBLIC_REPO_AUTH_KEY
  model_name_or_path: google/gemma-3-270m-it
  tokenizer_kwargs:
    model_input_names: ['input_ids', 'attention_mask']
    padding_side: left
    add_bos_token: true
registered_cfg:
  datamodule_cfg:
    prompt_cfg:
      class_path: rte_boolq.RTEBoolqChatTemplatePromptConfig
    signature_columns: ['input_ids', 'attention_mask', 'labels']
    text_fields: ["premise", "hypothesis"]
    enable_datasets_cache: True
    train_batch_size: 4
    eval_batch_size: 4
    # tokenize (and pad) in chunks of one batch: unshuffled batches are then padded to their own longest prompt, not
    # to the longest of 1,000
    prepare_data_map_cfg:
      batched: true
      batch_size: 4
  module_cfg:
    class_path: interpretune.adapters.nnsight.config.ITNNsightConfig
    init_args:
      auto_comp_cfg:
        class_path: interpretune.config.shared.AutoCompConfig
        init_args:
          module_cfg_name: RTEBoolqConfig
          module_cfg_mixin:
            class_path: rte_boolq.RTEBoolqEntailmentMapping
            import_only: true
      generative_step_cfg:
        class_path: rte_boolq.RTEBoolqGenerativeClassificationConfig
        init_args:
          enabled: false
      hf_from_pretrained_cfg:
        class_path: interpretune.config.mixins.HFFromPretrainedConfig
        init_args:
          pretrained_kwargs:
            dtype: float32
          model_head: transformers.Gemma3ForCausalLM
      nnsight_cfg:
        class_path: interpretune.adapters.nnsight.config.NNsightConfig
        init_args:
          model_name: google/gemma-3-270m-it
          torch_dtype: float32
          dispatch: true
          attn_implementation: eager
          tokenizer_kwargs:
            padding_side: left
            add_bos_token: true
      circuit_tracer_cfg:
        class_path: interpretune.adapters.circuit_tracer.config.CircuitTracerConfig
        init_args:
          backend: "nnsight"
          transcoder_set: "mwhanna/gemma-scope-2-270m-it/transcoder_all/width_16k_l0_small_affine"
          dtype: float32
          tune_base: true
          lazy_encoder: false
          lazy_decoder: false
          max_n_logits: 10
          desired_logit_prob: 0.95
          max_feature_nodes: 512
          batch_size: 64
          verbose: false
          use_neuronpedia: false
      optimizer_init:
        class_path: torch.optim.AdamW
        init_args:
          weight_decay: 0.0
          lr: 3.0e-05
  datamodule_cls:
    class_path: rte_boolq.RTEBoolqDataModule
  module_cls:
    class_path: rte_boolq.RTEBoolqModule
