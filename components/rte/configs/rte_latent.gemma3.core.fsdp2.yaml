# Derived key: rte_latent.gemma3.core.fsdp2
# Latent tuning of gemma-3-4b-it on RTE, shaped to be sharded with FSDP2 (interpretune#882, the recipe of
# interpretune#880): rsLoRA on the first 10 decoder layers (`lora_cfg`), and Gemma Scope 2 transcoders (16k features)
# spliced over the MLPs of layers 17 and 22 (`latent_tuning`). The base model stays in bf16 and frozen. What trains is
# held in fp32: PEFT casts its adapters, and the transcoders are loaded in it.
# `runs/rte_latent.gemma3_4b.core.fsdp2.yaml` builds it on the meta device and tunes it on two ranks;
# `runs/rte_latent.gemma3_27b.core.fsdp2.yaml` does the same for gemma-3-27b-it, overriding the model and transcoders.
task_variant: rte_latent
model: gemma3
composition: []
extensions: []
descriptor: fsdp2
reg_info:
  model_src_key: gemma3
  model_cfg_key: rte_latent
  adapter_combinations:
    - core
  description: Phased LoRA and transcoder-decoder tuning of Gemma3-4b-it, shaped for FSDP2 sharding on two ranks
shared_config:
  task_name: rte
  os_env_model_auth_key: HF_GATED_PUBLIC_REPO_AUTH_KEY
  model_name_or_path: google/gemma-3-4b-it
  tokenizer_kwargs:
    model_input_names: ['input_ids', 'attention_mask']
    padding_side: left
    add_bos_token: true
registered_cfg:
  datamodule_cfg:
    prompt_cfg:
      class_path: rte_boolq.RTEBoolqChatTemplatePromptConfig
    signature_columns: ['input_ids', 'attention_mask', 'labels']
    text_fields: ["premise", "hypothesis"]
    enable_datasets_cache: True
    train_batch_size: 2
    eval_batch_size: 2
    # tokenize (and pad) in chunks of one batch: unshuffled batches are then padded to their own longest prompt, not
    # to the longest of 1,000
    prepare_data_map_cfg:
      batched: true
      batch_size: 2
  module_cfg:
    class_path: interpretune.config.module.ITConfig
    init_args:
      auto_comp_cfg:
        class_path: interpretune.config.shared.AutoCompConfig
        init_args:
          module_cfg_name: RTEBoolqConfig
          module_cfg_mixin:
            - class_path: rte_boolq.RTEBoolqEntailmentMapping
              import_only: true
            - class_path: rte_boolq.RTEBoolqLatentCfg
              import_only: true
      latent_tuning:
        layers: [17, 22]
        transcoders:
          repo: google/gemma-scope-2-4b-it
          variant: width_16k_l0_small_affine
      # the test and validation steps run the model's forward rather than `generate`, which would call the Hugging Face
      # model directly
      generative_step_cfg:
        class_path: rte_boolq.RTEBoolqGenerativeClassificationConfig
        init_args:
          enabled: false
      hf_from_pretrained_cfg:
        class_path: interpretune.config.mixins.HFFromPretrainedConfig
        init_args:
          pretrained_kwargs:
            dtype: bfloat16
            attn_implementation: sdpa
          model_head: transformers.Gemma3ForConditionalGeneration
          lora_cfg:
            r: 8
            lora_alpha: 8
            use_rslora: true
            lora_dropout: 0.0
            # a regular expression over module names: the text model's first 10 decoder layers, not the vision tower's
            target_modules: '.*language_model\.layers\.[0-9]\.(self_attn|mlp)\.\w+_proj'
      # the loss reads only the answer position (the last, with left padding): skip the other positions' logits,
      # which at a 262k vocabulary are most of the activation memory
      cust_fwd_kwargs:
        logits_to_keep: 1
        use_cache: false
      optimizer_init:
        class_path: torch.optim.AdamW
        init_args:
          weight_decay: 0.0
          lr: 1.0e-05
  datamodule_cls:
    class_path: rte_boolq.RTEBoolqDataModule
  module_cls:
    class_path: rte_boolq.RTEBoolqLatentModule
